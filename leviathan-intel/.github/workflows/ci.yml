name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile ingest/*.py engine/*.py api/*.py
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: API smoke test
        env:
          ADMIN_TOKEN: ci-smoke-token
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          assert c.get("/health").status_code == 200
          r = c.get("/findings", params={"tenant_id": 1})
          assert r.status_code == 401  # wrong/missing token rejected
          print("API smoke OK")
          PY
