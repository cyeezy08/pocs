# .github/workflows/release.yml
# Build sdist + wheel, verify both, publish to GitHub Releases on tag push.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Wheels are attached to the GitHub Release rather than pushed to PyPI. The
# package name is not claimed on PyPI and publishing there is a decision with
# support consequences, so the artifact is versioned and installable without it.
# To install a release:
#   pip install https://github.com/leviathan-offsec/surfacediff/releases/download/v0.1.0/surfacediff-0.1.0-py3-none-any.whl
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test before shipping
        run: |
          pip install -e . pytest
          pytest -q

      - name: Guard, tag must match pyproject version
        run: |
          # A tag that disagrees with pyproject.toml produces a wheel whose
          # filename says one version and whose metadata says another, and pip
          # installs it without complaint.
          TAGVER="${GITHUB_REF_NAME#v}"
          FILEVER=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAGVER  pyproject=$FILEVER"
          if [ "$TAGVER" != "$FILEVER" ]; then
            echo "::error::tag $TAGVER does not match pyproject.toml ($FILEVER)"
            exit 1
          fi

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Verify the artifacts
        run: |
          ls -la dist/
          # Install the wheel into a clean venv and import it. A wheel that
          # builds but does not import is a release nobody can use.
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "import surfacediff; print('import ok:', surfacediff.__file__)"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Verify

            ```bash
            curl -sLO ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/checksums.sha256
            sha256sum -c checksums.sha256
            ```

            ## Install

            The console script and the import package are both `surfacediff`.

            ```bash
            pip install https://github.com/leviathan-offsec/surfacediff/releases/download/${{ github.ref_name }}/surfacediff-${{ github.ref_name }}-py3-none-any.whl
            surfacediff --help
            ```
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.sha256
