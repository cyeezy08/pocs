[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacediff"
version = "0.1.0"
description = "Snapshot and diff your external attack surface - zero dependencies, pipeline-native, feeds on ProjectDiscovery output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cyeezy08" }]
keywords = ["security", "recon", "attack-surface", "diff", "monitoring", "projectdiscovery"]
dependencies = []

[project.scripts]
surfacediff = "surfacediff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
