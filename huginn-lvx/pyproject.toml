[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huginn-lvx"
version = "0.1.2"
description = "Huginn LVX - GitHub-to-X.com auto-pilot for the Leviathan X stack. Own content, own account, ToS-clean."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
huginn = "huginn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/huginn"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
