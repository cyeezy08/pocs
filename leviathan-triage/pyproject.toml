[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leviathan-triage"
version = "0.2.2"
description = "The KEV firehose, triaged against YOUR stack, in your Discord. Zero packets, pure intel."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "cyeezy08" }]
requires-python = ">=3.9"
keywords = ["security", "triage", "kev", "epss", "cve", "discord", "easm", "leviathan"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
leviathan-triage = "leviathan_triage.cli:main"

[tool.setuptools]
packages = ["leviathan_triage"]
